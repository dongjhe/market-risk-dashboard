name: Update market data
on:
  push:
    paths:
      - 'scripts/update-market-data.mjs'
  workflow_dispatch:
    inputs:
      ark_value:
        description: 'Optional Ark risk value (0-100)'
        required: false
        type: string
  schedule:
    # Primary morning refresh: previous U.S. market close, Taiwan time.
    - cron: '30 8 * * *'
      timezone: 'Asia/Taipei'
    # Backup refresh in case GitHub drops/delays the primary scheduled event.
    - cron: '47 8 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest market data / save Ark value
        env:
          ARK_VALUE: ${{ inputs.ark_value }}
        run: node scripts/update-market-data.mjs
      - name: Commit history
        run: |
          if git diff --quiet data/history.json; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "data: update market indicators"
            git push
          fi
